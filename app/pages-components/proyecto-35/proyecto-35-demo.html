<section class="main__demo demo__course">

    <article class="course__card">

        <h2
            class="card__title"
            data-texto="¡Bienvenido al Curso!"
            aria-label="¡Bienvenido al Curso!"
        >
            <span class="title__typed" aria-hidden="true"></span>
        </h2>

        <figure class="card__image">
            <img
                class="image__img"
                src="/assets/img/proyecto-35/course-1.png"
                alt="Imagen del curso"
            >
        </figure>

        <p class="card__price">9.99€</p>

        <a 
            href="https://victorroblesweb.es/master-react" 
            class="card__btn"
            aria-label="Comprar el curso"
            target="_blank"
            rel="noopener noreferrer"
        >
            Comprar
        </a>

    </article>

</section>
